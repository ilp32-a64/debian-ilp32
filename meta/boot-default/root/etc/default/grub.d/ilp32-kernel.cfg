# Boot the newest ILP32 kernel by default; see /etc/default/ilp32-kernel. grub-mkconfig sources this
# under "set -e". After the package is removed this does nothing.
if [ -z "${GRUB_TOP_LEVEL:-}" ] && [ -x /usr/lib/ilp32-kernel/select ]; then
	ilp32_kernel_release=$(/usr/lib/ilp32-kernel/select || true)
	if [ -n "$ilp32_kernel_release" ]; then
		GRUB_TOP_LEVEL=/boot/vmlinuz-$ilp32_kernel_release
	fi
	unset ilp32_kernel_release
fi
