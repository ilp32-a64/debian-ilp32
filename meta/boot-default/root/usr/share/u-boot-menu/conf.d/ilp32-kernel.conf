# Boot the newest ILP32 kernel by default; see /etc/default/ilp32-kernel. u-boot-menu sources this
# under "set -e", and its callers read their arguments afterwards.
if [ -z "${U_BOOT_DEFAULT:-}" ] && [ -x /usr/lib/ilp32-kernel/select ]; then
	U_BOOT_DEFAULT=$(/usr/lib/ilp32-kernel/select --u-boot-label \
		"${U_BOOT_ENTRIES:-all}" "${U_BOOT_ALTERNATIVES:-default}" || true)
fi
